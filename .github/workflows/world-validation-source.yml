name: World validation source
on:
  push:
    branches: [feat/continuous-world-map]
    paths: [.github/workflows/world-validation-source.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Archive tracked source and lockfile-pinned dependencies
        run: |
          git archive HEAD | gzip > /tmp/world-source.tar.gz
          tar -czf /tmp/world-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: world-validation-inputs
          path: |
            /tmp/world-source.tar.gz
            /tmp/world-dependencies.tar.gz
          retention-days: 1
